name: Compilar los instalables

# Por que existe esto: una aplicacion Tauri enlaza contra las librerias graficas del sistema, asi
# que el instalable de Windows NO se puede compilar desde Linux (ni al reves). GitHub Actions
# presta una maquina de cada sistema: aqui se construyen y se cuelgan del release.
#
# Cuando se lanza:
#   - solo, al publicar un release (tag v*): los paquetes se adjuntan a ese release;
#   - a mano, desde la pestana Actions ("Run workflow"): quedan como artefactos descargables.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write      # hace falta para adjuntar los ficheros al release

jobs:
  linux:
    name: Linux (.deb, .rpm y AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de compilacion (WebKitGTK 4.1 y GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libdbus-1-dev libssl-dev \
            build-essential curl wget \
            file fuse libfuse2

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache de Rust (hace mas rapidas las siguientes compilaciones)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: escritorio/src-tauri

      - name: Instalar tauri-cli
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Preparar el frontend (copia la app a escritorio/app)
        working-directory: escritorio
        run: sh preparar-frontend.sh

      - name: Compilar .deb, .rpm y AppImage
        working-directory: escritorio/src-tauri
        run: cargo tauri build --bundles deb,rpm,appimage

      - name: Guardar los paquetes
        uses: actions/upload-artifact@v4
        with:
          name: linux-instalables
          path: |
            escritorio/src-tauri/target/release/bundle/deb/*.deb
            escritorio/src-tauri/target/release/bundle/rpm/*.rpm
            escritorio/src-tauri/target/release/bundle/appimage/*.AppImage

  windows:
    name: Windows (instalador .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache de Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: escritorio/src-tauri

      - name: Instalar tauri-cli
        run: cargo install tauri-cli --version "^2.0.0" --locked

      # En Windows el script es .sh; `sh` viene con Git for Windows, que ya esta en el runner.
      - name: Preparar el frontend
        working-directory: escritorio
        shell: sh
        run: ./preparar-frontend.sh

      - name: Compilar el instalador
        working-directory: escritorio/src-tauri
        run: cargo tauri build --bundles nsis

      - name: Guardar el instalador
        uses: actions/upload-artifact@v4
        with:
          name: windows-instalador
          path: escritorio/src-tauri/target/release/bundle/nsis/*.exe

  adjuntar-al-release:
    name: Adjuntar los paquetes al release
    needs: [linux, windows]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paquetes

      - name: Adjuntarlos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find paquetes -type f | sed 's/^/  /'
          gh release upload "${{ github.event.release.tag_name }}" \
            $(find paquetes -type f) --clobber --repo "${{ github.repository }}"
